name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Only the offline suites run here. tests/client.test.ts talks to the
      # live TD SYNNEX sandbox and needs credentials, so it stays out of CI.
      - name: Test (offline suites)
        run: npx jest tests/parser.test.ts
