name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas and use cases help shape the SDK. Describe the problem before proposing a solution.

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to accomplish that is hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like the SDK to behave?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, or workarounds you use today.
    validations:
      required: false

  - type: dropdown
    id: api-area
    attributes:
      label: Related API area
      options:
        - Purchase orders
        - Order status
        - Price & availability
        - Freight
        - Invoices
        - Types / DX
        - Documentation
        - Other
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Additional context
    validations:
      required: false
